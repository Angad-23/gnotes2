<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Note History — TutorNotes AI</title>
    <style>
        :root {
            --ink:#1a1a2e;--ink-soft:#4a4a6a;--ink-muted:#8888aa;
            --bg:#f7f6f2;--surface:#ffffff;--accent:#5b4fcf;--accent-light:#ede9ff;
            --success:#1d8a5e;--success-bg:#e8f7f1;--danger:#b91c1c;--danger-bg:#fef2f2;
            --border:#e2e0f0;--radius:10px;--radius-lg:16px;
        }
        *{box-sizing:border-box;margin:0;padding:0;}
        body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;}
        header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 32px;display:flex;align-items:center;justify-content:space-between;height:60px;position:sticky;top:0;z-index:10;}
        .logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;color:var(--accent);}
        .logo-icon{width:32px;height:32px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;color:white;font-size:16px;}
        nav a{color:var(--ink-soft);text-decoration:none;font-size:14px;margin-left:20px;}
        nav a:hover{color:var(--accent);}
        main{max-width:860px;margin:0 auto;padding:36px 24px 80px;}
        .page-title{font-size:26px;font-weight:700;letter-spacing:-.5px;margin-bottom:4px;}
        .page-sub{color:var(--ink-muted);font-size:14px;margin-bottom:28px;}
        .alert{padding:12px 16px;border-radius:var(--radius);margin-bottom:20px;font-size:14px;background:var(--success-bg);border:1px solid #c0e8d8;color:var(--success);}
        .note-row{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px 20px;margin-bottom:12px;display:flex;align-items:flex-start;gap:16px;}
        .note-row-info{flex:1;min-width:0;}
        .note-meta{font-size:12px;color:var(--ink-muted);margin-bottom:4px;}
        .note-student{font-size:15px;font-weight:600;margin-bottom:4px;}
        .note-preview{font-size:13px;color:var(--ink-soft);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
        .note-actions{display:flex;gap:8px;flex-shrink:0;}
        .btn-view{padding:6px 14px;background:var(--accent-light);border:none;border-radius:7px;color:var(--accent);font-size:13px;font-weight:500;text-decoration:none;cursor:pointer;}
        .btn-del{padding:6px 10px;background:var(--danger-bg);border:1px solid #fecaca;border-radius:7px;color:var(--danger);font-size:13px;cursor:pointer;}
        .tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:4px;margin-right:5px;}
        .tag-student{background:var(--accent-light);color:var(--accent);}
        .tag-group{background:var(--success-bg);color:var(--success);}
        .empty{text-align:center;padding:60px 20px;color:var(--ink-muted);}
        .empty a{color:var(--accent);text-decoration:none;}
    </style>
</head>
<body>
<header>
    <div class="logo"><div class="logo-icon">✏️</div> TutorNotes AI</div>
    <nav><a href="/">New Note</a><a href="/history">History</a></nav>
</header>
<main>
    <div class="page-title">Note History</div>
    <div class="page-sub" th:text="${notes.size()} + ' session notes saved'"></div>

    <div th:if="${deleted}" class="alert">Note deleted successfully.</div>

    <div th:if="${#lists.isEmpty(notes)}" class="empty">
        <p style="font-size:32px;margin-bottom:12px">📄</p>
        <p>No notes yet. <a href="/">Generate your first note →</a></p>
    </div>

    <div th:each="note : ${notes}" class="note-row">
        <div class="note-row-info">
            <div class="note-meta">
                <span th:class="${note.noteType.name() == 'GROUP'} ? 'tag tag-group' : 'tag tag-student'"
                      th:text="${note.noteType.name() == 'GROUP'} ? 'Group' : 'Student'"></span>
                <span th:text="${#temporals.format(note.sessionDate, 'MMM d, yyyy')}"></span>
                <span th:if="${note.topic}" th:text="' · ' + ${note.state} + ' · Grade ' + ${note.grade} + ' · ' + ${note.topic}"></span>
            </div>
            <div class="note-student" th:text="${note.studentNames}"></div>
            <div class="note-preview" th:text="${note.generatedNote}"></div>
        </div>
        <div class="note-actions">
            <a th:href="@{/notes/{id}(id=${note.id})}" class="btn-view">View</a>
            <form th:action="@{/notes/{id}/delete(id=${note.id})}" method="post"
                  onsubmit="return confirm('Delete this note?')">
                <button type="submit" class="btn-del">🗑</button>
            </form>
        </div>
    </div>
</main>
</body>
</html>
