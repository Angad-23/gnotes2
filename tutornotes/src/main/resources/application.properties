# ── Server ──────────────────────────────────────────────────
server.port=8080

# ── MySQL ────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/tutornotes?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=YOUR_MYSQL_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ──────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Run schema.sql on startup (first run only — comment out after)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# ── Groq API ─────────────────────────────────────────────────
groq.api.key=YOUR_GROQ_API_KEY
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.api.model=llama3-70b-8192
groq.api.max-tokens=1024

# ── Thymeleaf ────────────────────────────────────────────────
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# ── Logging ──────────────────────────────────────────────────
logging.level.com.tutornotes=DEBUG
logging.level.org.springframework.web=INFO
